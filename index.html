<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honigbua – Bio-Imkerei aus dem Schneebergland</title>
    <meta name="description" content="Zertifizierte Bio-Imkerei Claudia und Hans-Jürgen Linzer in Saubersdorf, Schneebergland (NÖ). Bio Wald-, Blüten- und Cremehonig, Oxymel, Propolistropfen & Bio-Carnica-Bienen.">
    <style>
        /* Eigene Schriftarten einbinden */
        @font-face {
            font-family: 'SUNDAY';
            src: url('sunday.otf') format('opentype'),
                 url('sunday.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Reef';
            src: url('reef.otf') format('opentype'),
                 url('reef.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-cream: #FDFBF7;
            --bg-sand: #F4EFE6;
            --honey: #D98A2B;
            --honey-dark: #B56E18;
            --forest: #2C3E2D;
            --forest-light: #4A634C;
            --text-dark: #2B2620;
            --text-muted: #5E564C;
            --white: #FFFFFF;
            --radius: 14px;
            --shadow: 0 10px 30px rgba(44, 62, 45, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Reef', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.65;
            font-size: 1.05rem;
            overflow-x: hidden; /* Verhindert horizontales Scrollen durch am Rand platzierte Bienen */
        }

        h1, h2, h3, .logo-text {
            font-family: 'SUNDAY', Georgia, serif;
            letter-spacing: 0.5px;
            font-weight: normal;
        }

        /* Navigation */
        header {
            background-color: rgba(253, 251, 247, 0.96);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(217, 138, 43, 0.18);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.7rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-link {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: var(--forest);
        }

        .logo-link img {
            height: 54px;
            width: auto;
            display: block;
        }

        .logo-text {
            font-size: 1.55rem;
        }

        .logo-text span {
            color: var(--honey);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--honey);
        }

        /* Hero Section mit frei fliegenden Bienen am Rand */
        .hero {
            background: linear-gradient(135deg, #2C3E2D 0%, #3E5440 100%);
            color: var(--white);
            padding: 5.5rem 1.5rem 6rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Biene links oben im Hero-Bereich abgeschnitten */
        .hero::before {
            content: "";
            position: absolute;
            top: -30px;
            left: -40px;
            width: 160px;
            height: 160px;
            background: url('biene.png') no-repeat center center;
            background-size: contain;
            opacity: 0.25;
            transform: rotate(-25deg);
            pointer-events: none;
        }

        /* Biene rechts unten im Hero-Bereich abgeschnitten */
        .hero::after {
            content: "";
            position: absolute;
            bottom: 10px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: url('biene.png') no-repeat center center;
            background-size: contain;
            opacity: 0.2;
            transform: rotate(35deg);
            pointer-events: none;
        }

        .hero-content {
            max-width: 820px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            background-color: rgba(217, 138, 43, 0.22);
            color: #F8C471;
            border: 1px solid rgba(248, 196, 113, 0.4);
            padding: 0.35rem 1rem;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            line-height: 1.18;
            margin-bottom: 1.2rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: #E6ECE7;
            margin-bottom: 2.2rem;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--honey);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--honey-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.12);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Allgemeine Sections */
        section {
            padding: 4.5rem 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }

        /* Kräftigere, liebevoll platzierte Bienen als Hintergrund-Akzente am Rand */
        #ueber-uns {
            position: relative;
        }
        #ueber-uns::before {
            content: "";
            position: absolute;
            left: -60px;
            top: 15%;
            width: 220px;
            height: 220px;
            background: url('biene.png') no-repeat center center;
            background-size: contain;
            opacity: 0.12; /* Kräftiger & sichtbar, aber dezent genug für den Text */
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .section-header {
            text-align: center;
            max-width: 720px;
            margin: 0 auto 3.2rem auto;
            position: relative;
            z-index: 1;
        }

        .section-header h2 {
            font-size: 2.25rem;
            color: var(--forest);
            margin-bottom: 0.7rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Über uns / Philosophie */
        .about-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .about-text h3 {
            color: var(--forest);
            font-size: 1.6rem;
            margin-bottom: 0.9rem;
        }

        .about-text p {
            color: var(--text-muted);
            margin-bottom: 1.1rem;
        }

        .quality-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .pill {
            background-color: var(--bg-sand);
            color: var(--forest);
            padding: 0.45rem 0.9rem;
            border-radius: 50px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .about-photo {
            width: 100%;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            object-fit: cover;
            aspect-ratio: 4 / 3;
        }

        .feature-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 1.4rem;
            margin-top: 3rem;
            position: relative;
            z-index: 1;
        }

        .feature-item {
            background: var(--white);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-top: 4px solid var(--honey);
        }

        .feature-item h4 {
            color: var(--forest);
            margin-bottom: 0.45rem;
            font-size: 1.15rem;
        }

        .feature-item p {
            color: var(--text-muted);
            font-size: 0.98rem;
            margin: 0;
        }

        /* Foto-Galerie Einblicke */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.2rem;
            margin-top: 3rem;
            position: relative;
            z-index: 1;
        }

        .gallery-card {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .gallery-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.03);
        }

        .gallery-caption {
            padding: 0.85rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--forest);
            text-align: center;
        }

        /* Sortiment mit spielerischen Bienen am Rand */
        .products-wrapper {
            background-color: var(--bg-sand);
            padding: 4.5rem 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .products-wrapper::before {
            content: "";
            position: absolute;
            right: -70px;
            top: 10%;
            width: 280px;
            height: 280px;
            background: url('biene.png') no-repeat center center;
            background-size: contain;
            opacity: 0.12;
            transform: rotate(25deg);
            pointer-events: none;
        }

        .products-wrapper::after {
            content: "";
            position: absolute;
            left: -50px;
            bottom: 5%;
            width: 250px;
            height: 250px;
            background: url('biene.png') no-repeat center center;
            background-size: contain;
            opacity: 0.12;
            transform: rotate(-30deg);
            pointer-events: none;
        }

        .products-inner {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
            gap: 1.8rem;
        }

        .product-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-icon {
            font-size: 2.2rem;
            margin-bottom: 1rem;
        }

        .product-card h3 {
            color: var(--forest);
            font-size: 1.5rem;
            margin-bottom: 0.6rem;
        }

        .product-card p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 1.4rem;
        }

        .sizes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid #EFEAE1;
        }

        .size-tag {
            background-color: var(--bg-sand);
            color: var(--forest);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
        }

        /* Ab-Hof-Verkauf & Kontakt */
        .contact-box {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.8rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            border-top: 5px solid var(--forest);
            position: relative;
            z-index: 1;
        }

        .brand-badges {
            display: flex
